<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100d16"><title>NÃO APERTE</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 35%,#29212e,#100d16 65%);color:#fff;font-family:system-ui,-apple-system,sans-serif;min-height:100svh;display:grid;place-items:center;overflow:hidden}header{position:fixed;top:28px;left:30px;right:30px;display:flex;justify-content:space-between;color:#aaa0af;font-size:11px;letter-spacing:.14em}header b{color:white}main{text-align:center;padding:25px;width:min(100%,720px)}h1{font-size:clamp(48px,9vw,100px);letter-spacing:-.075em;line-height:.96;margin:0 0 22px}p{font-size:clamp(16px,2vw,20px);color:#c5b9c7;min-height:60px}#arena{height:230px;display:grid;place-items:center}#red{border:1px solid #ff8c8c;border-radius:50%;width:158px;height:158px;background:radial-gradient(circle at 30% 20%,#ff7777,#d7233e 65%,#8a102c);box-shadow:0 20px 80px #d7233e66,inset 0 5px 12px #ffffff55;color:white;font-weight:900;letter-spacing:.16em;cursor:pointer;transition:transform .2s,filter .2s;touch-action:manipulation}#red:hover{filter:brightness(1.15)}#red:active{transform:scale(.88)}small{color:#807284;letter-spacing:.13em}#dots{position:fixed;bottom:35px;display:flex;gap:8px}#dots i{width:5px;height:5px;border-radius:50%;background:#594958}#dots i.on{background:#ff526c;box-shadow:0 0 10px #ff526c}.action{border:0;border-radius:30px;padding:16px 22px;margin:7px;background:#f7e9ed;color:#201421;font-weight:800;cursor:pointer}.action.alt{background:#39303d;color:white}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style><header><b>ESTÚDIO DE MÁS IDEIAS</b><span id="counter">DESOBEDIÊNCIAS: 00</span></header><main><h1 id="title">NÃO<br>APERTE.</h1><p id="message" aria-live="polite">É só um botão. Você consegue deixar ele em paz?</p><div id="arena"><button id="red">NÃO</button></div><small id="hint">UM EXPERIMENTO SOBRE AUTOCONTROLE</small></main><div id="dots"></div><script>const phrases=['Eu pedi uma coisa simples.','Você não é muito bom em seguir instruções, né?','Esse foi o último aviso.','Você acha que existe um prêmio?','O botão está ficando nervoso.','Eu poderia simplesmente desaparecer.','Não, sério. Pare agora.','Você está ensinando coisas ruins ao botão.','Ele quer negociar. Um clique e fica quieto.','Mentira. Ele nunca fica quieto.','Já pensou em fechar esta aba?','Ele acha que você não consegue parar.','Você está perto demais.','Última chance de provar que tem controle.','Tudo bem. Você venceu. Ou foi o botão?'];let n=0;const $=id=>document.getElementById(id),b=$('red');$('dots').innerHTML='<i></i>'.repeat(15);function tone(){try{const C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=220+n*30;g.gain.value=.035;g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.12);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+.12);o.onended=()=>c.close()}catch(e){}}function end(){const endings=['VOCÊ NÃO RESISTIU.','O BOTÃO VENCEU.','VOCÊ É O PROBLEMA.'];const variant=Math.floor(Math.random()*3);$('title').textContent=endings[variant];$('message').textContent='Quinze oportunidades de parar. Você escolheu continuar. Desafie alguém a fazer melhor.';$('arena').innerHTML='<div><button class="action" id="share">DESAFIAR ALGUÉM</button><button class="action alt" id="again">RECOMEÇAR</button></div>';$('hint').textContent='FINAL '+(variant+1)+' DE 3';$('again').onclick=()=>location.reload();$('share').onclick=async()=>{const data={title:'NÃO APERTE',text:'Eu apertei. Você consegue resistir?',url:location.href};try{if(navigator.share)await navigator.share(data);else{await navigator.clipboard.writeText(data.text+' '+data.url);$('hint').textContent='LINK COPIADO'}}catch(e){}}}b.onclick=()=>{n++;tone();$('counter').textContent='DESOBEDIÊNCIAS: '+String(n).padStart(2,'0');$('message').textContent=phrases[n-1];$('title').innerHTML=n<5?'NÃO<br>APERTE.':n<10?'EU DISSE<br>NÃO.':'VOCÊ<br>INSISTE.';$('hint').textContent=n<10?'VOCÊ AINDA PODE PARAR':'ISSO JÁ É PESSOAL';[...$('dots').children].forEach((x,i)=>x.classList.toggle('on',i<n));if(n===6)b.style.rotate='-12deg';if(n===8)b.textContent='SIM';if(n===9)b.textContent='NÃO';if(n===13)b.textContent='PARE';if(n===15)end()};</script></html>
