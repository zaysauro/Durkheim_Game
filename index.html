<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080c19"><title>PULSE — um jogo de precisão</title><meta name="description" content="Um toque. Um instante. Quanto tempo você aguenta?"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080c19;color:#eef7ff;font-family:Inter,system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}.hud{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;padding:25px clamp(20px,5vw,60px);display:flex;justify-content:space-between;pointer-events:none}.brand{font-size:12px;letter-spacing:.32em;font-weight:900;color:#b4c7ed}.brand b{color:#69ffda}.stat{text-align:right;font-size:12px;letter-spacing:.15em;color:#8194b9}.stat strong{display:block;color:white;font-size:27px;letter-spacing:-.04em}.bottom{position:fixed;bottom:calc(26px + env(safe-area-inset-bottom,0px));width:100%;text-align:center;color:#8194b9;font-size:11px;letter-spacing:.16em;pointer-events:none}.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:#080c1966;backdrop-filter:blur(8px);padding:22px}.panel{width:min(100%,500px)}.eyebrow{color:#69ffda;letter-spacing:.32em;font-size:11px;font-weight:800}h1{font-size:clamp(62px,14vw,112px);line-height:.85;letter-spacing:-.095em;margin:22px 0 28px;text-shadow:0 0 70px #51b7ff55}p{line-height:1.7;color:#b5c4e0;font-size:16px;margin:0 auto 30px;max-width:390px}.primary{background:#6bffdd;color:#071522;border:0;padding:17px 38px;border-radius:50px;font-size:13px;font-weight:900;letter-spacing:.15em;cursor:pointer;box-shadow:0 0 35px #6bffdd44}.mini{margin-top:25px;color:#7085ab;font-size:12px}.hidden{display:none}.pill{display:inline-block;padding:7px 12px;border:1px solid #324563;border-radius:30px;color:#a3b6d5;font-size:11px;letter-spacing:.13em;margin-bottom:8px}@media(prefers-reduced-motion:reduce){.overlay{backdrop-filter:none}}</style></head><body><canvas id="game"></canvas><div class="hud"><div class="brand">KUMU <b>/ LAB</b><div style="font-size:9px;letter-spacing:.2em;color:#6d80a4;margin-top:8px">EXPERIMENTO 002</div></div><div class="stat">PONTOS<strong id="score">00</strong><span id="combo">COMBO × 1</span></div></div><div class="bottom" id="footer">TOQUE NO RITMO. ACERTE O ARCO.</div><div class="overlay" id="overlay"><div class="panel"><div class="eyebrow" id="eyebrow">UM JOGO DE UM TOQUE</div><h1 id="heading">PULSE<span style="color:#6bffdd">.</span></h1><p id="description">Uma agulha gira sem parar. Toque quando ela atravessar o arco luminoso. Cada acerto acelera o tempo. Um erro e acabou.</p><button class="primary" id="start">COMEÇAR</button><div class="mini" id="best">RECORDE: 0</div></div></div><script>(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),scoreEl=document.getElementById('score'),comboEl=document.getElementById('combo'),footer=document.getElementById('footer'),bestEl=document.getElementById('best');let W=0,H=0,dpr=1,R=130,angle=-Math.PI/2,target=0,width=.62,speed=1.65,points=0,combo=0,best=0,playing=false,last=0,flash=0,particles=[],stars=[];try{best=Number(localStorage.getItem('pulseBest')||0)}catch(e){}bestEl.textContent='RECORDE: '+best;const TAU=Math.PI*2,rand=(a,b)=>a+Math.random()*(b-a),norm=a=>(a%TAU+TAU)%TAU,dist=(a,b)=>Math.abs(Math.atan2(Math.sin(a-b),Math.cos(a-b)));function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);R=Math.min(W*.33,H*.245,175);stars=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,r:rand(.3,1.3),a:rand(.1,.55)}))}addEventListener('resize',resize);resize();function sound(ok){try{const A=window.AudioContext||window.webkitAudioContext,a=new A(),o=a.createOscillator(),g=a.createGain();o.type=ok?'sine':'sawtooth';o.frequency.setValueAtTime(ok?440+Math.min(combo,12)*35:120,a.currentTime);o.frequency.exponentialRampToValueAtTime(ok?760:60,a.currentTime+.16);g.gain.setValueAtTime(.065,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.2);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.2);o.onended=()=>a.close()}catch(e){}}function burst(a,ok){const cx=W/2,cy=H/2,x=cx+Math.cos(a)*R,y=cy+Math.sin(a)*R;for(let i=0;i<32;i++){const q=rand(0,TAU),v=rand(60,260);particles.push({x,y,vx:Math.cos(q)*v,vy:Math.sin(q)*v,life:rand(.25,.7),max:.7,color:ok?'#6bffdd':'#ff647f'})}}function next(){target=norm(angle+rand(1.25,4.6)*(speed>0?1:-1));width=Math.max(.27,.66-points*.014);if(points%5===0&&points>0)speed*=-1}function start(){angle=-Math.PI/2;speed=1.65;points=0;combo=0;target=norm(angle+2.1);width=.65;flash=0;particles=[];playing=true;overlay.classList.add('hidden');scoreEl.textContent='00';comboEl.textContent='COMBO × 1';footer.textContent='TOQUE QUANDO A AGULHA ENTRAR NO ARCO';last=performance.now()}function finish(){playing=false;sound(false);burst(angle,false);flash=-1;best=Math.max(best,points);try{localStorage.setItem('pulseBest',String(best))}catch(e){}document.getElementById('eyebrow').textContent=points>=10?'IMPRESSÃO DIGITAL: PRECISÃO':'O TEMPO NÃO PERDOA';document.getElementById('heading').textContent=points>=10?'BRILHANTE.':'FIM DE JOGO.';document.getElementById('description').textContent='Você fez '+points+' ponto'+(points===1?'':'s')+'. Seu recorde é '+best+'. Consegue superar?';document.getElementById('start').textContent='TENTAR DE NOVO';bestEl.textContent='RECORDE: '+best;setTimeout(()=>overlay.classList.remove('hidden'),450)}function tap(){if(!playing)return;const hit=dist(angle,target)<width/2+.085;if(hit){points++;combo++;sound(true);burst(angle,true);flash=.32;scoreEl.textContent=String(points).padStart(2,'0');comboEl.textContent='COMBO × '+combo;speed=Math.sign(speed)*(1.65+points*.13);next();if(navigator.vibrate)navigator.vibrate(15)}else finish()}document.getElementById('start').addEventListener('click',e=>{e.stopPropagation();start()});canvas.addEventListener('pointerdown',tap);addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'){e.preventDefault();if(playing)tap()}});function draw(t){const dt=Math.min((t-last)/1000||0,.05);last=t;if(playing)angle=norm(angle+speed*dt);flash=Math.max(-1,flash-dt);ctx.clearRect(0,0,W,H);const cx=W/2,cy=H/2;let glow=ctx.createRadialGradient(cx,cy,20,cx,cy,R*2.8);glow.addColorStop(0,'#172943');glow.addColorStop(1,'#080c19');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);for(const s of stars){ctx.globalAlpha=s.a;ctx.fillStyle='#b4d7ff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,TAU);ctx.fill()}ctx.globalAlpha=1;ctx.lineWidth=1;ctx.strokeStyle='#25334c';for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(cx,cy,R*(.68+i*.17),0,TAU);ctx.stroke()}ctx.lineWidth=15;ctx.lineCap='round';ctx.strokeStyle='#1d2b41';ctx.beginPath();ctx.arc(cx,cy,R,0,TAU);ctx.stroke();ctx.shadowBlur=25;ctx.shadowColor='#6bffdd';ctx.strokeStyle='#6bffdd';ctx.lineWidth=17;ctx.beginPath();ctx.arc(cx,cy,R,target-width/2,target+width/2);ctx.stroke();ctx.shadowBlur=0;const px=cx+Math.cos(angle)*R,py=cy+Math.sin(angle)*R;ctx.strokeStyle='#c0d9ff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(px,py);ctx.stroke();ctx.fillStyle='#fff';ctx.shadowBlur=20;ctx.shadowColor='#b7d8ff';ctx.beginPath();ctx.arc(px,py,8,0,TAU);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#91a8c7';ctx.beginPath();ctx.arc(cx,cy,7,0,TAU);ctx.fill();ctx.textAlign='center';ctx.fillStyle=flash>0?'#6bffdd':'#e5f4ff';ctx.font='800 '+Math.max(22,R*.27)+'px system-ui';ctx.fillText(playing?'×'+Math.max(combo,1):'PULSE',cx,cy+R*.53);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,3,3)}ctx.globalAlpha=1;particles=particles.filter(p=>p.life>0);if(flash===-1){ctx.fillStyle='#ff345018';ctx.fillRect(0,0,W,H)}requestAnimationFrame(draw)}requestAnimationFrame(draw)})();</script></body></html>
